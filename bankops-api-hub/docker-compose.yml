version: "3.9"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: bankops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankops}
      POSTGRES_USER: ${POSTGRES_USER:-bankops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bankops-net

  redis:
    image: redis:7-alpine
    container_name: bankops-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bankops-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bankops-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bankops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-bankops}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - bankops-net

  # ─── Application Services ────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: bankops-api-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=api-gateway
      - TRANSACTION_SERVICE_URL=${TRANSACTION_SERVICE_URL:-http://transaction-service:8001}
      - ORCHESTRATION_SERVICE_URL=${ORCHESTRATION_SERVICE_URL:-http://orchestration-engine:8003}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bankops-net

  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile
    container_name: bankops-transaction-service
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=transaction-service
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bankops-net

  event-bus:
    build:
      context: ./services/event-bus
      dockerfile: Dockerfile
    container_name: bankops-event-bus
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=event-bus
    ports:
      - "${EVENT_BUS_PORT:-8002}:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bankops-net

  orchestration-engine:
    build:
      context: ./services/orchestration-engine
      dockerfile: Dockerfile
    container_name: bankops-orchestration-engine
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=orchestration-engine
      - CONNECTOR_SERVICE_URL=${CONNECTOR_SERVICE_URL:-http://connector-framework:8004}
    ports:
      - "${ORCHESTRATION_ENGINE_PORT:-8003}:8003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bankops-net

  connector-framework:
    build:
      context: ./services/connector-framework
      dockerfile: Dockerfile
    container_name: bankops-connector-framework
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=connector-framework
    ports:
      - "${CONNECTOR_FRAMEWORK_PORT:-8004}:8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bankops-net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: bankops-notification-service
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_NAME=notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8005}:8005"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bankops-net

  # ─── Observability ───────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: bankops-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    networks:
      - bankops-net

  grafana:
    image: grafana/grafana:latest
    container_name: bankops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-bankops-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - bankops-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: bankops-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - bankops-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  bankops-net:
    driver: bridge
