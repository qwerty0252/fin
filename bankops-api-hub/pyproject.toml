[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", "migrations", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["migrations", "venv", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services"]
python_files = "test_*.py"
python_functions = "test_*"
